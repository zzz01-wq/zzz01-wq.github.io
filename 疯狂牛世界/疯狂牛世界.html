<aside class="journey"><div class="eyebrow"><span class="live-dot"></span> 海上漂流日记 <span id="day">DAY 01</span></div><h2 id="islandName">一小块海上希望</h2><div class="island-stats"><span id="herdCount">1 头牛</span><i></i><span id="tileCount">9 块木筏</span><span id="level">Lv. 1</span></div><button id="quest" class="quest"><span class="quest-icon">↗</span><span><small>下一步 · 小小的开始</small><strong id="questTitle">打捞 5 份漂流物</strong><span class="progress"><i id="questProgress"></i></span></span><b id="questCount">0/5</b></button><div id="weather" class="weather">☀ 微风 · 今天也适合做梦</div></aside>

let audio=null,master=null,note=0,musicClock=0;
function audioStart(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=world.s.muted?0:.22;master.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function tone(freq,duration=.2,volume=.1,type='sine'){if(!audio||audio.state!=='running'||world.s.muted)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(volume,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+duration+.02);o.onended=()=>{o.disconnect();g.disconnect();};}
function sfx(kind){if(kind==='rare'){[196,261.63,392,523.25].forEach((f,i)=>setTimeout(()=>tone(f,.6,.3,'triangle'),i*130));}else if(kind==='build'||kind==='reward'||kind==='rescue'){tone(523,.22,.3);setTimeout(()=>tone(784,.4,.25),90);}else tone(660,.1,.1);}
function music(dt){if(world.s.muted||!audio||audio.state!=='running')return;musicClock+=dt;if(musicClock>1.1){musicClock=0;const seq=[0,7,12,16,14,7,4,12,0,7,9,16,14,12,7,4];tone(130.81*2**(seq[note%seq.length]/12),1.8,.20);if(note%4===0)tone(65.4,3,.12,'triangle');note++;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(world.s));$('saveState').textContent='本地自动存档';}catch{if(!storageFailed){toast('当前浏览器不能保存进度，本次仍可正常游玩。');storageFailed=true;}$('saveState').textContent='本次进度未保存';}}
function toast(text){const e=document.createElement('div');e.className='toast';e.textContent=text;$('toasts').appendChild(e);while($('toasts').children.length>3)$('toasts').firstChild.remove();setTimeout(()=>e.remove(),3600);}
function processNotices(){for(const n of world.notices.splice(0)){if(n.kind==='rare'){$('eventName').textContent=n.text+' · 正在靠近';$('event').classList.remove('show');void $('event').offsetWidth;$('event').classList.add('show');}else toast(n.text);sfx(n.kind);}}
function updateUI(){const s=world.s;for(const k in RESOURCE_NAMES)$('res-'+k).textContent=s.resources[k]>=100000?Math.floor(s.resources[k]/1000)+'k':Math.floor(s.resources[k]).toLocaleString();$('herdCount').textContent=`${world.herdSize} 头牛 · ${s.raftTier} 阶木筏`;$('tileCount').textContent=`${s.tiles.length} 块木筏`;$('level').textContent=`Lv. ${world.level}`;$('day').textContent='DAY '+String(1+Math.floor(s.time/120)).padStart(2,'0');$('islandName').textContent=['一小块海上希望','小牛们的漂流村','海风吹过青草地','越来越牛的日子','我们的海上牛王国'][world.level-1];$('questTitle').textContent=world.task.name;const complete=world.taskProgress>=world.task.goal;$('questCount').textContent=complete?'领取 →':`${world.taskProgress}/${world.task.goal}`;$('questProgress').style.width=(world.taskProgress/world.task.goal*100)+'%';$('dockHerd').textContent=world.herdSize+' 位家人';$('dockBook').textContent=s.discovered.length+' / 6 已发现';$('dockTask').textContent=complete?'奖励待领取':'成长日记';$('cooldown').textContent=s.cooldown>0?`${Math.ceil(s.cooldown)} 秒后可撒网`:'附近资源 · 自动收集';$('salvage').disabled=s.cooldown>0||s.paused;$('sound').innerHTML=icon(s.muted?'mute':'sound');$('sound').setAttribute('aria-label',s.muted?'开启声音':'关闭声音');$('sound').setAttribute('aria-pressed',String(s.muted));$('voyage').textContent=`第 ${s.sea} 海域 · ${world.canSail?'可远航':'远航 →'}`;$('voyage').classList.toggle('ready',world.canSail);$('weather').textContent=world.bonus>0?`✦ 丰收暖流 · ${Math.ceil(world.bonus)} 秒双倍打捞`:`☀ ${world.seaTheme.name} · 物资 ×${s.sea}`;}
function row(art,title,desc,cost,action,label,disabled=false){return `<div class="build-row"><div class="item-art">${icon(art)}</div><div class="item-details"><h3>${title}</h3><p>${desc}</p>${cost?`<p class="cost">${cost}</p>`:''}</div><button class="buy" data-action="${action}" ${disabled?'disabled':''}>${label}</button></div>`;}
function openPanel(name){audioStart();previousFocus=document.activeElement;panel=name;target=null;keys.clear();joy={x:0,y:0};$('stick').style.transform='';$('modal').hidden=false;for(const e of $('game').children)if(e!==$('modal'))e.inert=true;renderPanel();$('close').focus();}
function closePanel(){if(world.s.paused){world.s.paused=false;save();}panel=null;$('modal').hidden=true;for(const e of $('game').children)e.inert=false;previousFocus?.focus();last=performance.now();}
function renderPanel(){const s=world.s,b=$('panelBody');const titles={build:['海上营造所','建设你的海上家园'],herd:['每一头牛，都值得被接住','一起漂流的家人'],book:['海风会带来怎样的相遇','一本很牛的图鉴'],tasks:['把小日子，过成大梦想','小牛的成长日记'],pause:['慢一点，也没有关系','让海风等一等'],reset:['重新出发','开启一场新的梦'],voyage:['梦没有尽头，海也是','带着家园去远航']};$('panelEyebrow').textContent=titles[panel][0];$('panelTitle').textContent=titles[panel][1];
 if(panel==='build'){
  b.innerHTML='<p class="panel-intro">铺设甲板扩大活动空间，升阶木筏提升生产与设施上限。家园、牛群和资源会陪你一起去下一个海域。</p>'
  +row('tile',`木筏升阶 <small>${s.raftTier} 阶 → ${s.raftTier+1} 阶</small>`,`产出 +15% 基础值 · 设施上限 ${world.buildingCap+2} 级 · 打捞范围提升`,world.costText(world.tierCost()),'tier','升阶',!world.canPay(world.tierCost()))
  +row('flag',`远航 · 第 ${s.sea} 海域`,`${world.seaTheme.name} · ${world.voyageGoals.filter(g=>g.value>=g.goal).length}/5 项准备就绪`,'保留木筏、牛群、设施与库存','voyage','查看')
  +row('tile','扩建甲板',`新增 1 块空间 · 当前 ${s.tiles.length}/81 块`,s.tiles.length>=81?'甲板铺满后仍可持续升阶':world.costText(world.expandCost()),'expand',s.tiles.length>=81?'已铺满':'扩建',s.tiles.length>=81||!world.canPay(world.expandCost()))
  +row('grass','铺设青草',`每 3 块草地每轮产 1 青草 · 已铺 ${s.tiles.filter(t=>t.grass).length} 块`,'4 青草','plant','铺设',s.tiles.every(t=>t.grass)||s.resources.grass<4)
  +BUILDINGS.map(d=>{const lv=s.buildings[d.id]?.level||0,locked=world.level<d.unlock,capped=lv>=world.buildingCap;return row(d.icon,`${d.name} <small>${lv?'Lv.'+lv:'未建造'}</small>`,d.desc+' · 享受木筏产出加成',locked?`家园 Lv.${d.unlock} 解锁`:capped?'升阶木筏可继续升级':world.costText(world.buildingCost(d.id)),'build:'+d.id,locked?'未解锁':capped?'需升阶':lv?'升级':'建造',locked||capped||!world.canPay(world.buildingCost(d.id)));}).join('');
 }
 if(panel==='voyage'){
  const next=SEAS[s.sea%SEAS.length];
  b.innerHTML=`<div class="voyage-summary"><span class="eyebrow">第 ${s.sea} 海域</span><h3>${world.seaTheme.name}</h3><p>${world.seaTheme.desc}</p><div class="voyage-metrics"><span>漂流收益 <b>×${s.sea}</b></span><span>来访牛品阶 <b>${s.sea} 阶</b></span><span>木筏产出 <b>+${Math.round((world.yieldBoost-1)*100)}%</b></span></div></div><p class="panel-intro">准备好就继续向前。远航保留全部建设、库存和伙伴，只更新海上漂流物与本海域目标。</p>`
  +world.voyageGoals.map(g=>`<div class="build-row"><span class="task-check">${g.value>=g.goal?'✓':'·'}</span><div class="item-details"><h3>${g.name}</h3></div><span class="badge">${Math.min(g.value,g.goal)} / ${g.goal}</span></div>`).join('')
  +`<div class="next-sea"><small>下一站 · 第 ${s.sea+1} 海域</small><h3>${next.name}</h3><p>漂流收益 ×${s.sea+1} · 牛品阶 ${s.sea+1} 阶</p></div><button class="buy wide" data-action="sail" ${world.canSail?'':'disabled'}>带上整个家，出发 →</button><button class="secondary" data-action="construction">去升阶 / 建造设施</button><p class="dev-note">四种海域风貌轮转，海域序号、木筏阶数与设施上限持续提升。</p>`;
 }

 if(panel==='book'){b.innerHTML='<p class="panel-intro">从初生的小牛到梦里的大家伙，每一次相遇都留在这里。提高家园等级解锁新牛种；远航遇到高品阶同类后，该牛种全体产出提升。</p><div class="book-grid">'+COWS.map((d,i)=>{const seen=s.discovered.includes(i);return `<div class="cow-card ${seen?'':'locked'}"><canvas data-cow="${i}"></canvas><h3>${seen?d.name:'未知的牛朋友'}</h3><p>${seen?d.desc:`家园 Lv.${d.level} 后出现`}</p><span class="badge">${seen?d.tag+' · '+s.breedRanks[i]+' 阶':'尚未相遇'}</span></div>`;}).join('')+'</div>';drawPortraits();}
 if(panel==='herd'){b.innerHTML=`<div class="herd-summary"><div><b>${world.herdSize}</b><small>家人与随行牛队</small></div><div><b>${s.discovered.length}</b><small>已相遇牛种</small></div><div><b>${Math.max(0,Math.ceil(world.productionInterval-s.production))}<small> 秒</small></b><small>下一轮生产</small></div></div><p class="panel-intro">小牛自己找草，伙伴们安心产奶。木筏越高阶，生产越快、产出越多；没有青草或饲料时，对应生产会等待补给。</p>`+COWS.map((d,i)=>{const n=s.cows.filter(c=>c.type===i).length+s.reserve[i];return n?`<div class="build-row"><div class="item-art">${icon('cow')}</div><div class="item-details"><h3>${d.name} <small>× ${n}</small></h3><p>${d.yield} · 品阶倍率 ×${s.breedRanks[i]}${s.reserve[i]?`<br>含随行牛队 ${s.reserve[i]} 头`:""}</p></div><span class="badge">${s.breedRanks[i]} 阶</span></div>`:'';}).join('')+`<p class="dev-note">甲板 ${s.cows.length}/${world.capacity} 头 · 其余加入随行牛队，同样生产<br>甲板最多展示 60 头，随行牛队持续成长。</p>`;}
 if(panel==='tasks'){b.innerHTML='<p class="panel-intro">完成任务后领取奖励。每个小小的进步，都在让海上牛王国长大。</p>'+QUESTS.map((q,i)=>{const past=i<s.quest,active=i===s.quest;return `<div class="build-row"><span class="task-check">${past?'✓':String(i+1).padStart(2,'0')}</span><div class="item-details"><h3>${q.name}</h3><p>${world.costText(q.reward)}</p></div>${past?'<span class="badge">已完成</span>':active?`<button class="buy gold" data-action="claim" ${world.taskProgress<q.goal?'disabled':''}>${world.taskProgress>=q.goal?'领取':world.taskProgress+' / '+q.goal}</button>`:'<span class="badge">待开启</span>'}</div>`;}).join('');b.innerHTML+=row('flag',`远航 · 第 ${s.sea} 海域`,world.seaTheme.name,'家园随行，海域持续推进','voyage','查看');if(s.quest>=QUESTS.length)b.innerHTML+=row('flag',world.task.name,'长期委托，可反复完成',world.costText(world.task.reward),'claim',world.taskProgress>=world.task.goal?'领取':'继续打捞',world.taskProgress<world.task.goal);}
 if(panel==='pause'){b.innerHTML=`<div class="pause-art">☁</div><p class="pause-copy">牛在休息，海也在休息。<br>你的海上家园已经保存，回来时我们继续。</p><button class="buy wide" data-action="resume">继续漂流 →</button><button class="secondary" data-action="sound">${s.muted?'开启':'关闭'}音乐与音效</button><div class="help">移动：拖动左下摇杆 / WASD / 方向键<br>打捞：靠近自动收集 / 点击海面移动 / 空格撒网<br>建设：扩建、铺草，再建造和升级生产设施<br>稀有牛：升级家园，留出位置迎接它们<br>暂停：Esc / P · 存档：当前浏览器本地保存</div><button class="secondary" data-action="reset">重新开始一场梦</button>`;}
 if(panel==='reset')b.innerHTML='<p class="pause-copy">这会清除当前浏览器里的木筏、牛群和资源进度。<br>确认后，从初生的小牛重新开始。</p><button class="buy wide" data-action="confirm-reset">确认重新开始</button><button class="secondary" data-action="cancel-reset">保留家园，返回</button>';
}
function drawPortraits(){requestAnimationFrame(()=>{document.querySelectorAll('[data-cow]').forEach(c=>renderer.portrait(c,Number(c.dataset.cow)));});}
function toggleSound(){audioStart();world.s.muted=!world.s.muted;if(master)master.gain.setTargetAtTime(world.s.muted?0:.22,audio.currentTime,.03);save();updateUI();}
$('panelBody').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;audioStart();if(a==='resume'){closePanel();return;}if(a==='sound'){toggleSound();renderPanel();return;}if(a==='reset'){panel='reset';renderPanel();return;}if(a==='cancel-reset'){panel='pause';renderPanel();return;}if(a==='confirm-reset'){world.s=CowWorld.fresh();world.drops=[];world.effects=[];world.bonus=0;world.spawnCount=0;for(let i=0;i<14;i++)world.spawnDrop(i%5);world.spawnCow(1,true);if(master)master.gain.setTargetAtTime(.22,audio.currentTime,.03);save();closePanel();toast('新的海风，新的开始。');updateUI();return;}if(a==='voyage'){panel='voyage';renderPanel();return;}if(a==='construction'){panel='build';renderPanel();return;}if(a==='sail'){if(world.sail()){save();closePanel();processNotices();updateUI();}return;}if(a==='tier')world.upgradeRaft();if(a==='expand')world.expand();if(a==='plant')world.plant();if(a.startsWith('build:'))world.build(a.split(':')[1]);if(a==='claim')world.claim();processNotices();save();updateUI();const scroll=$('panelBody').scrollTop;renderPanel();$('panelBody').scrollTop=scroll;$('close').focus({preventScroll:true});});
for(const el of document.querySelectorAll('[data-panel]'))el.addEventListener('click',()=>openPanel(el.dataset.panel));
$('voyage').onclick=()=>openPanel('voyage');$('close').onclick=closePanel;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closePanel();});
$('sound').onclick=toggleSound;$('pause').onclick=()=>{world.s.paused=true;save();openPanel('pause');};
$('quest').onclick=()=>{if(world.taskProgress>=world.task.goal){world.claim();processNotices();save();updateUI();}else openPanel('tasks');};
$('salvage').onclick=()=>{audioStart();if(!panel&&!world.s.paused){world.salvage();sfx('normal');processNotices();updateUI();}};
const j=$('joystick');function joyMove(e){const r=j.querySelector('.joy-ring').getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const len=Math.hypot(x,y),max=r.width*.30;if(len>max){x=x/len*max;y=y/len*max;}joy={x:x/max,y:y/max};$('stick').style.transform=`translate(${x}px,${y}px)`;}
j.addEventListener('pointerdown',e=>{if(panel||world.s.paused)return;audioStart();pointer=e.pointerId;j.setPointerCapture(pointer);target=null;joyMove(e);});j.addEventListener('pointermove',e=>{if(e.pointerId===pointer)joyMove(e);});function releaseJoy(){pointer=null;joy={x:0,y:0};$('stick').style.transform='';}j.addEventListener('pointerup',releaseJoy);j.addEventListener('pointercancel',releaseJoy);j.addEventListener('lostpointercapture',releaseJoy);
$('sea').addEventListener('pointerdown',e=>{if(panel||world.s.paused)return;audioStart();const rect=$('sea').getBoundingClientRect();const p=renderer.unproject(e.clientX-rect.left,e.clientY-rect.top);target=world.nearest(p.x,p.z);const close=world.drops.find(d=>{const q=renderer.project(d.x,.3,d.z);return Math.hypot(q[0]-e.clientX+rect.left,q[1]-e.clientY+rect.top)<32;});if(close)target=world.nearest(close.x,close.z);});
window.addEventListener('keydown',e=>{if(e.key==='Tab'&&panel){const focusable=[...$('modal').querySelectorAll('button:not(:disabled)')];const first=focusable[0],end=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus();}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus();}return;}const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(e.repeat&&['p','escape',' '].includes(k))return;if(k==='escape'||k==='p'){if(panel)closePanel();else{world.s.paused=true;save();openPanel('pause');}return;}if(panel)return;audioStart();if(k===' '){$('salvage').click();return;}keys.add(k);target=null;});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();releaseJoy();target=null;save();});document.addEventListener('visibilitychange',()=>{keys.clear();releaseJoy();last=performance.now();if(document.hidden){save();audio?.suspend().catch(()=>{});}else if(!world.s.muted&&audio)audio.resume().catch(()=>{});});
window.addEventListener('pagehide',save);window.addEventListener('resize',()=>renderer.resize());document.addEventListener('contextmenu',e=>e.preventDefault());
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!panel&&!world.s.paused&&!document.hidden){let sx=joy.x+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),sy=joy.y+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let dx=sx+sy,dz=sy-sx;if(target){dx=target.x-world.s.player.x;dz=target.z-world.s.player.z;if(Math.hypot(dx,dz)<.09){target=null;dx=dz=0;}}let len=Math.hypot(dx,dz);renderer.moving=len>.04;if(len>.04)world.move(dx/Math.max(1,len),dz/Math.max(1,len),dt);world.update(dt);music(dt);processNotices();}else renderer.moving=false;renderer.draw();uiClock+=dt;saveClock+=dt;if(uiClock>.2){uiClock=0;updateUI();}if(saveClock>5){saveClock=0;save();}requestAnimationFrame(frame);}
updateUI();processNotices();requestAnimationFrame(frame);if(world.s.paused)openPanel('pause');else if(!saved)setTimeout(()=>toast('小牛，欢迎来到海上。拖动摇杆，靠近漂流物吧！'),700);
})();

</script>
</body></html>
