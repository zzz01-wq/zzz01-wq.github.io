<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141312"><title>杀戮尖塔 II</title><link rel="stylesheet" href="/style.css?v=20260929-clean-meta-descriptions-1"></head>
<body>
<header class="masthead"><div class="wordmark"><span class="mark" aria-hidden="true">Ⅱ</span><div>杀戮尖塔 <span class="roman">II</span></div></div><div id="connection" class="connection" role="button" tabindex="0" aria-label="连接状态" aria-disabled="true"><i></i><span>连接中</span></div></header>
<main class="no-player">
<section class="workspace" aria-label="主要内容">
<div class="workspace-heading"><h1 id="location">尖塔入口</h1><span id="stage" class="stage">等待启程</span></div>
<div id="encounter" class="encounter" aria-live="polite" hidden></div>
<div class="terminal-body">
<div id="scroll-area" class="scroll-area">
<div id="welcome" class="welcome" aria-live="polite"></div>
<section id="map-view" class="map-view" role="dialog" aria-modal="true" aria-label="旅程地图" hidden>
<div class="map-heading"><div><h2>旅程路线</h2></div><div class="map-tools" role="group" aria-label="路线查看和标注工具"><button id="map-zoom-out" type="button" title="缩小地图" aria-label="缩小地图">−</button><span id="map-zoom-label" class="map-zoom-label" aria-live="polite">100%</span><button id="map-zoom-reset" type="button" title="恢复地图默认大小" aria-label="恢复地图默认大小">重置</button><button id="map-zoom-in" type="button" title="放大地图" aria-label="放大地图">+</button><button id="map-draw" type="button" aria-pressed="false">手绘</button><button id="map-erase" type="button" aria-pressed="false">擦除</button><button id="map-clear" type="button">清除笔迹</button><button id="map-close" type="button" aria-label="收起地图">收起</button></div></div>
<div class="map-canvas" role="region" tabindex="0" aria-label="可滚动查看完整路线图"><svg id="map-svg" role="img" aria-label="尖塔路线图"><g id="map-guides"></g><g id="map-links"></g><g id="map-nodes"></g><g id="map-ink"></g></svg></div>
<div class="map-footer"><div id="map-legend" class="map-legend"></div><div id="map-next" class="map-next"></div></div>
</section>
<div id="choice" class="choice" hidden></div>
</div>
<details id="command-log" class="command-log-panel">
<summary><span>命令历史</span><span id="command-history-count" class="command-history-count">0 条</span></summary>
<ol id="command-history-list" class="command-history-list" aria-label="已提交的命令"></ol>
</details>
</div>
<div id="hand" class="hand" hidden></div>
<div class="command-area"><div class="prompt-line"><span id="prompt"></span><span id="working" hidden>结算中<span class="dots">…</span></span></div><form id="command-form" autocomplete="off"><label for="command" class="command-symbol" aria-label="输入">›</label><input id="command" type="text" spellcheck="false" autocapitalize="off" aria-label="输入操作" placeholder="" maxlength="256" disabled><button type="submit" id="submit" disabled>执行 <span>↵</span></button></form></div>
</section>
<aside class="inspector" aria-label="角色和旅程状态" hidden>
<div class="character-heading"><span class="eyebrow">角色状态</span><div class="character-name"><b id="player-name">铁甲战士</b><span id="player-class">铁甲战士</span></div></div>
<div id="character-status" class="character-status"><div class="empty-status">尚未踏入尖塔</div></div>
<section id="route-preview" class="side-section route-preview-panel" aria-label="路线预览" hidden></section>
<section class="side-section"><h2>随身遗物 <span id="relic-count">—</span></h2><div id="relics" class="relics"><span class="muted">旅程开始后显示</span></div></section>
<section class="side-section"><h2>药水</h2><div id="potions" class="potions"><span class="muted">—</span></div></section>
<div id="run-controls" class="run-controls" hidden><button id="run-abandon" class="run-abandon-button" type="button">放弃</button></div>
<div class="run-foot"><span id="seed">SEED —</span></div>
</aside>
</main>
<dialog id="intent-dialog" class="intent-dialog" aria-labelledby="intent-dialog-title">
<div class="intent-dialog-heading"><div><h2 id="intent-dialog-title">敌人意图</h2></div><button id="intent-dialog-close" class="intent-dialog-close" type="button" aria-label="关闭意图说明">×</button></div>
<div id="intent-dialog-content" class="intent-dialog-content"></div>
</dialog>
<dialog id="card-preview-dialog" class="card-preview-dialog" aria-labelledby="card-preview-title">
<div class="card-preview-heading"><div><span class="eyebrow">卡牌预览</span><h2 id="card-preview-title">卡牌</h2></div><button id="card-preview-close" class="intent-dialog-close" type="button" aria-label="关闭卡牌预览">×</button></div>
<div id="card-preview-body" class="card-preview-body"></div>
<div id="card-preview-actions" class="card-preview-actions"></div>
</dialog>
<div id="keyword-tooltip" class="keyword-tooltip" popover="manual" role="tooltip" aria-hidden="true"><strong id="keyword-tooltip-title"></strong><span id="keyword-tooltip-description"></span></div>
<dialog id="deck-dialog" class="deck-dialog" aria-labelledby="deck-dialog-title">
<div class="deck-dialog-heading"><div><span class="eyebrow">牌组</span><h2 id="deck-dialog-title">当前牌组</h2></div><button id="deck-dialog-close" class="intent-dialog-close" type="button" aria-label="关闭牌组">×</button></div>
<div class="deck-browser"><div id="deck-card-list" class="deck-card-list"></div><section id="deck-card-detail" class="deck-card-detail" aria-live="polite"></section></div>
</dialog>
<dialog id="run-abandon-dialog" class="run-abandon-dialog" aria-labelledby="run-abandon-title" aria-describedby="run-abandon-body">
<h2 id="run-abandon-title">你确定吗？</h2>
<p id="run-abandon-body">放弃游戏会被视为本局失败。</p>
<div class="run-abandon-dialog-actions"><button id="run-abandon-cancel" class="menu-button menu-secondary" type="button">不了</button><button id="run-abandon-confirm" class="menu-button menu-primary" type="button">好的</button></div>
</dialog>
<script src="/app.js?v=20260929-clean-meta-descriptions-1" defer></script>
</body></html>
